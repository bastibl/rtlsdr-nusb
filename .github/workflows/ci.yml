name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo package --locked

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, smol, tokio, all]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test without hardware
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          args=()
          case "$FEATURES" in
            smol|tokio) args+=(--features "$FEATURES") ;;
            all) args+=(--all-features) ;;
          esac
          cargo test --locked --all-targets "${args[@]}"
          cargo test --locked --doc "${args[@]}"

  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features

  wasm:
    name: WebUSB compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --lib --target wasm32-unknown-unknown
      - run: cargo check --locked --lib --target wasm32-unknown-unknown --all-features
